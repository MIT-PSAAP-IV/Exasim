site_name: Exasim
site_description: >-
  High-order discontinuous Galerkin PDE solvers in C++ with symbolic code
  generation and Kokkos backend portability (CPU / GPU / MPI).
repo_url: https://github.com/MIT-PSAAP-IV/Exasim
repo_name: MIT-PSAAP-IV/Exasim
edit_uri: edit/master/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  # Pull live code from the repo (e.g. tests/consumers/*) so docs don't drift.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

# Nav grows phase by phase; every entry must resolve so `mkdocs build --strict`
# stays green at each step.
nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Choosing an application mode: usage-modes/index.md
  - Installation:
      - install/index.md
      - Quick Installation (Recommended): install/quick-install.md
      - CPU Installation via Superbuild: install/superbuild-cpu.md
      - Troubleshooting Superbuild Failures: install/superbuild-troubleshooting.md
      - Manual Dependency Installation: install/manual-dependencies.md
      - Common manual dependency steps: install/common.md
      - GPU Installation: install/gpu.md
      - "Platform: macOS": install/macos.md
      - "Platform: Linux CPU": install/linux-cpu.md
      - "Platform: Linux NVIDIA GPU": install/linux-nvidia.md
      - "Platform: Linux AMD GPU": install/linux-amd.md
      - "HPC: build chain & options": install/hpc.md
      - "HPC: Frontier": install/frontier.md
      - "HPC: Tuolumne": install/tuolumne.md
      - "HPC: Generic": install/generic-hpc.md
      - Verification and Testing: install/verification.md
  - Text2Code Applications:
      - Overview: text2code-applications/index.md
      - pdeapp.txt guide: text2code-applications/pdeapp.md
      - pdemodel.txt guide: text2code-applications/pdemodel.md
      - PDE modeling guide: text2code-applications/modeling-guide.md
      - Application setup guide: text2code-applications/application-setup.md
      - Workflow and troubleshooting: text2code-applications/workflow.md
      - Advanced topics: text2code-applications/advanced.md
      - Reference gateway: text2code-applications/reference.md
  - Frontends:
      - Overview: frontends/index.md
      - Getting started: frontends/getting-started.md
      - Core data structures: frontends/data-structures.md
      - Configuration: frontends/configuration.md
      - Preprocessing: frontends/preprocessing.md
      - pdemodel abstraction: frontends/pdemodel.md
      - Mesh and geometry: frontends/mesh-and-geometry.md
      - Execution workflow: frontends/execution.md
      - Postprocessing and visualization: frontends/postprocessing.md
      - API reference: frontends/api-reference.md
  - Application Modes:
      - usage-modes/index.md
      - Built-in library: usage-modes/builtin.md
      - External built-in library: usage-modes/external-builtin.md
      - Shared library: usage-modes/shared-library.md
      - Parameter sweeps: usage-modes/parameter-sweeps.md
      - Postprocessing: usage-modes/postprocessing.md
  - Physics Models:
      - Overview: physics-models/index.md
      - ModelC: physics-models/modelc.md
      - ModelD: physics-models/modeld.md
      - ModelW: physics-models/modelw.md
      - Model comparison: physics-models/comparison.md
      - Auxiliary equations through w: physics-models/auxiliary-equations.md
      - Equations of state: physics-models/equations-of-state.md
      - External variables through v: physics-models/external-variables.md
      - Artificial viscosity: physics-models/artificial-viscosity.md
      - Multiphysics problems: physics-models/multiphysics.md
      - Multi-model problems: physics-models/multi-model.md
      - Worked examples: physics-models/examples.md
  - Theory:
      - theory/index.md
      - LDG formulation: theory/ldg-formulation.md
